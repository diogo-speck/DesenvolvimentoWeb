<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Contato</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='css/global.css'>
    <link rel='stylesheet' href='css/form.css'>
    <script src='main.js'></script>
</head>
<style>
    a {
        color: rgba(255, 255, 255);
    }

    .serv-card {
        font-size: 200%;
        background-color: #b39e7b;
        border: 1px solid black;
        border-radius: 5px;
        box-shadow: 0 2px 4px rgb(189, 131, 8, 0.3);
        margin: 15px;
        padding: 1%;
        width: 27%;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .serv-card img {
        width: 100%;
    }

    .gallery {
        display: flex;
        flex-direction: row;
        justify-content: center;
        margin: 5px;
        padding: 5px;
        flex-wrap: wrap;
    }

    header button {
        justify-content: left;
    }
</style>

<body>
    <header>
        <div class="button">
            <p><a href=index.html>←Voltar</a></p>
        </div>
        <h1>Contato</h1>
        <h2>Entre em contato com nossos voluntários!</h2>
    </header>
    <div class="gallery">
        <div class="serv-card">
            <div>
                <img src="https://tse3.mm.bing.net/th/id/OIP.nD5MTxfqXxCaXZeLlOMRQwHaE8?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                    alt="uma foto de voluntários">
                <p>Seja um voluntário</p>
                <p>Faça a diferença!</p>
            </div>
        </div>
        <div class="serv-card">
            <div>
                <img src="https://tse1.mm.bing.net/th/id/OIP.XZ5AfWClRB5nT9YwBZqQTgHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                    alt="logo do whatsapp">
                <p>Whatsapp</p>
                <p><a href=5547999899799>+55 (47) 99989-9799</a></p>
            </div>
        </div>
        <div class="serv-card">
            <div>
                <img src="https://logodownload.org/wp-content/uploads/2017/04/instagram-logo-6.png"
                    alt="logo instagram">
                <p><a href=https://www.instagram.com/animal.ong>Instagram</a></p>
                <p>Principal canal de divulgação da Ong.</p>
            </div>
        </div>
    </div>

    <footer>
        <form>
            <label>Nome: </label>
        </form>
        <input type="text" id="nome" required>
        <br>
        <br>
        <form>
        <label>E-mail: </label>
        </form>
        <input type="email" id="eamil" required>
        <br>
        <br>
        <form>
        <label>Telefone: </label>
        </form>
        <input type="tel" id="tel" required>
        <br>
        <br>
        <form>
        <label>CPF: </label>
        </form>
        <input type="text" id="text" required>
        <br>
        <br>
        <form>
        <label>Mensagem: </label>
        </form>
        <textarea id="msg" rows="6" cols="30" required></textarea>
        <br>
        <br>
        <button>
            <input type="submit" value="Enviar">
        </button>
    </footer>
</body>

</html>
