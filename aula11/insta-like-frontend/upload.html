<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaLike/postar</title>
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/byte.ico">
    <meta name="description"
        content="Explore o mundo com Viagem Dev! Veja fotos inspiradoras e histórias de viagens incríveis.">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/form.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                Insta<strong>Like</strong>
            </div>
            <div class="nav-links">
                <button class="login-btn" aria-label="Entrar">Entrar</button>
                <a href="#" class="signup-link" aria-label="Cadastre-se">Cadastre-se</a>
            </div>
        </nav>
    </header>
    <main class="profile-container">
        <section class="upload-form">
            <h2> Novo postagem </h2>
            <form id="form-post" enctype="multipart/form-data">
                <label> Descrição: </label>
                <input type="text" id="descricao" required>
                <label> Imagem: </label>
                <input type="file" id="imagem" accept="image/*" required>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <script>
        document.getElementById("form-post").addEventListener("submit", function (e) {
            e.preventDefault();
        });
    </script>

    <script src="assets/js/upload.js" type="module"></script>
    <!--- <script src="assets/js/upload.js" type="module"></script> --->
</body>

</html>
