<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset='utf-8'>
    <title>Meteora</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <header>
        <div id="navbar-mainpage"></div>
        <div id="carousel-mainpage"></div>
    </header>
    <main>
        <section>
            <h2 id="text-center mt-5">Busque por categoria</h2>
            <div id="minicards-mainpage" class="row mt-5 p-3" style="justify-content: center"></div>
        </section>
        <section>
            <h2 id="text-center mt-1" style="padding-top: 1%;">Procure produtos que estão bombando</h2>
            <div id="bigcards-mainpage" class="row 3-column-wide px-2 p-3"></div>
        </section>
        <section>
            <h2 id="text-center mt-5" style="padding-top: 1%;">Conheça todas as nossas facilidades</h2>
            <div id="facil-mainpage" class="mt-5"></div>
        </section>
    </main>
    <footer>
        <h3 id="text-center mt-5">Quer receber as novas novidades e promoções exclusivas? <b>Cadastre-se!</b></h2>
            <div id="form-mainpage" class="mt-5"></div>
    </footer>
    <div class="loading justify-content-center text-center">
        <div class="spinner-border m-5" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    <script type="text/javascript" src="scripts/loadings.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
